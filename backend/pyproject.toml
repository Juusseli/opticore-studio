[project]
name = "opticore"
version = "0.1.0"
description = "OptiCore Studio optical physics engine and API"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # refractiveindex.info glass data (YAML) for the catalogue installer
    "pyyaml>=6.0",
    # OpenCascade kernel for STEP/IGES import and export (Apache-2.0 bindings; OCCT LGPL-2.1 with exception)
    "cadquery-ocp==8.0.1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# building the installable packages (packaging/)
package = ["pyinstaller>=6.16"]

[project.scripts]
# the desktop program: the engine with the built user interface in an app window (opticore/desktop.py)
opticore-studio = "opticore.desktop:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opticore*"]

[tool.setuptools.package-data]
opticore = ["materials/data/*.json", "materials/data/*.csv", "materials/data/*.md", "samples/*.json", "photometry/data/*.csv", "photometry/data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
